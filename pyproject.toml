[project]
name = "affine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "bittensor",
    "huggingface-hub>=0.24",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.13",
    "smart_open[s3]>=7.0",
    "targon-sdk",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
viz = ["matplotlib>=3.8"]

[project.scripts]
affine = "affine.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["affine*"]

[tool.pytest.ini_options]
addopts = "-m 'not diagnostic and not e2e_fault'"
markers = [
    "diagnostic: characterization and anomaly-hunting tests (non-gating by default)",
    "e2e_fault: fault-injection integration drills (non-gating by default)",
]
