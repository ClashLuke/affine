[project]
name = "affine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "bittensor",
    "huggingface-hub>=0.24",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.13",
    "smart_open[s3]>=7.0",
    "targon-sdk",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
affine = "affine.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["affine*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
