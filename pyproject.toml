[project]
name = "affine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "bittensor",
    "affinetes",
    "httpx>=0.27",
    "targon",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
affine = "affine.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
