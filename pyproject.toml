[project]
name = "affine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "bittensor",
    "huggingface-hub>=0.24",
    "httpx>=0.27",
    "numpy>=1.26",
    "smart_open[s3]>=7.0",
    "targon-sdk",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
affine = "affine.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["affine*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
# Dense one-liner style is a deliberate house preference (see CLAUDE.md
# "dense, functional, low-ceremony Python"). Silencing E701/E702 keeps the
# next `ruff check` signal-not-noise so dead imports and real bugs stand out.
ignore = ["E701", "E702"]
